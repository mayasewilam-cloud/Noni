<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 375" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8EEFF" />
      <stop offset="100%" stop-color="#FCE4EC" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg4)" />
  <circle cx="250" cy="170" r="110" fill="#FFFFFF" opacity="0.85" />
  
  <!-- Birthday Cake & Candles -->
  <g transform="translate(190, 110)">
    <!-- Plate -->
    <ellipse cx="60" cy="98" rx="60" ry="12" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Cake Base -->
    <rect x="20" y="55" width="80" height="40" rx="6" fill="#F6B7D2" stroke="#103657" stroke-width="3"/>
    <path d="M 20 65 Q 30 72 40 65 Q 50 72 60 65 Q 70 72 80 65 Q 90 72 100 65" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <!-- Frosting Top -->
    <ellipse cx="60" cy="55" rx="40" ry="12" fill="#FFFFFF" stroke="#103657" stroke-width="3"/>
    
    <!-- Candles -->
    <rect x="42" y="32" width="6" height="22" rx="2" fill="#91D5F5" stroke="#103657" stroke-width="2"/>
    <ellipse cx="45" cy="24" rx="4" ry="7" fill="#FFE066"/>
    
    <rect x="57" y="28" width="6" height="26" rx="2" fill="#F5E5C7" stroke="#103657" stroke-width="2"/>
    <ellipse cx="60" cy="20" rx="4" ry="7" fill="#FFB703"/>
    
    <rect x="72" y="32" width="6" height="22" rx="2" fill="#91D5F5" stroke="#103657" stroke-width="2"/>
    <ellipse cx="75" cy="24" rx="4" ry="7" fill="#FFE066"/>
  </g>
  
  <text x="250" y="275" font-family="sans-serif" font-size="18" font-weight="bold" fill="#103657" text-anchor="middle">Another Year of Magic 🎂✨</text>
  <text x="250" y="302" font-family="sans-serif" font-size="13" fill="#2E5B82" text-anchor="middle">Celebrating you today, tomorrow, and always</text>
</svg>
