      <stop offset="0%" stop-color="#FCE4EC" />
      <stop offset="100%" stop-color="#D8EEFF" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg1)" />
  <circle cx="200" cy="210" r="110" fill="#FFFFFF" opacity="0.8" />
  
  <!-- Popcorn Bucket -->
  <g transform="translate(145, 150)">
    <path d="M 15 35 L 30 115 L 80 115 L 95 35 Z" fill="#FFFFFF" stroke="#B8336A" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 35 35 L 45 115" stroke="#B8336A" stroke-width="4"/>
    <path d="M 55 35 L 57 115" stroke="#B8336A" stroke-width="4"/>
    <path d="M 75 35 L 68 115" stroke="#B8336A" stroke-width="4"/>
    
    <!-- Popcorn pieces -->
    <circle cx="28" cy="26" r="14" fill="#FFF275" stroke="#D4A017" stroke-width="2"/>
    <circle cx="48" cy="18" r="16" fill="#FFF275" stroke="#D4A017" stroke-width="2"/>
    <circle cx="70" cy="22" r="15" fill="#FFF275" stroke="#D4A017" stroke-width="2"/>
    <circle cx="86" cy="32" r="13" fill="#FFF275" stroke="#D4A017" stroke-width="2"/>
    <circle cx="38" cy="34" r="13" fill="#FFF8B0" />
    <circle cx="62" cy="32" r="14" fill="#FFF8B0" />
